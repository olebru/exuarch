name: Pull request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, closed]
    branches: [main]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && 'title' || 'build' }}
  cancel-in-progress: true

jobs:
  title:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check that the title is a conventional commit
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_and_preview:
    if: github.event.action != 'closed' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Test
        run: |
          dotnet test Exuarch.Core.Tests
          dotnet test Exuarch.Web.Tests
          dotnet test Exuarch.Cli.Tests

      - name: Install the WebAssembly build tools
        run: dotnet workload install wasm-tools

      - name: Version
        run: echo "VERSION=$(jq -r '."."' .release-please-manifest.json)-pr.${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"

      - name: Publish
        run: dotnet publish Exuarch.Web -c Release -o publish -p:Version="$VERSION"

      - name: Deploy the preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          skip_app_build: true

  close_preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Remove the preview environment
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: ""
